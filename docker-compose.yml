services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '5173:5173'
    environment:
      # Same-origin relative requests; the SPA node / proxy serves /api and /_auth.
      VITE_API_BASE_URL: ''
      VITE_BASE_URL: './'
      VITE_PROXY_TARGET: http://host.docker.internal:1880
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  node_modules:
